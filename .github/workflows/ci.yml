name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: pip install --pre genlayer-test==0.30.0rc2 genvm-linter==0.11.1rc2

      - name: Lint contract
        run: genvm-lint check contracts/NarrowGrant.py

      - name: Run direct-mode tests
        run: gltest tests/direct
